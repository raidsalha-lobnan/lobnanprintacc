    <script>
      (function() {
        try {
          var savedHost = localStorage.getItem('master_server_host_url');
          if (savedHost && (savedHost.includes('vercel.app') || savedHost.includes('netlify.app') || savedHost.includes('github.io'))) {
            localStorage.removeItem('master_server_host_url');
          }
        } catch (e) {}

        var nativeFetch = window.fetch;
        if (nativeFetch) {
          window.fetch = function(input, init) {
            var urlStr = typeof input === 'string' ? input : (input && input.url ? input.url : '');
            if (urlStr && (urlStr.includes('vercel.app') || urlStr.includes('netlify.app'))) {
              var rewritten = urlStr.replace(/https?:\/\/[^\/]+/, '');
              return nativeFetch.call(window, rewritten, init);
            }
            return nativeFetch.apply(window, arguments);
          };
        }

        try {
          var currentFetch = window.fetch ? window.fetch.bind(window) : undefined;
          try {
            Object.defineProperty(window, 'fetch', {
              get: function() { return currentFetch; },
              set: function(fn) { currentFetch = fn; },
              configurable: true,
              enumerable: true
            });
          } catch (e1) {
            try {
              Object.defineProperty(Window.prototype, 'fetch', {
                get: function() { return currentFetch; },
                set: function(fn) { currentFetch = fn; },
                configurable: true,
                enumerable: true
              });
            } catch (e2) {}
          }
        } catch (e) {}

        window.addEventListener('error', function(event) {
          if (!event || !event.message) {
            event?.preventDefault?.();
            return;
          }
          var msg = String(event.message || '');
          if (
            msg.includes('fetch') ||
            msg.includes('getter') ||
            msg.includes('ResizeObserver') ||
            msg.includes('AudioContext') ||
            msg.includes('send was called before connect') ||
            msg.includes('WebSocket') ||
            msg.includes('[vite]') ||
            msg.includes('Sheet fetch error') ||
            msg.includes('M_ID') ||
            msg.includes('200.js') ||
            msg.includes('extension')
          ) {
            event.preventDefault();
            event.stopPropagation();
            return true;
          }
        }, true);

        // Catch unhandled promise rejections to prevent blank uncaught crashes and silence external extension noise
        window.addEventListener('unhandledrejection', function(event) {
          var reasonStr = String(event.reason || event.reason?.message || event.reason?.stack || '');
          if (
            reasonStr.includes('send was called before connect') ||
            reasonStr.includes('WebSocket') ||
            reasonStr.includes('vite') ||
            reasonStr.includes('Sheet fetch error') ||
            reasonStr.includes('M_ID') ||
            reasonStr.includes('200.js') ||
            reasonStr.includes('extension') ||
            reasonStr.includes('chrome-extension')
          ) {
            event.preventDefault();
            event.stopPropagation();
            return;
          }
          console.warn('Unhandled promise rejection safely handled:', event.reason);
          event.preventDefault();
        });

        // Enforce Native Desktop App Behavior: Prevent browser Save As (Ctrl+S) and Print (Ctrl+P) dialogs
        window.addEventListener('keydown', function(e) {
          var isCtrlOrMeta = e.ctrlKey || e.metaKey;
          if (isCtrlOrMeta) {
            var key = String(e.key || '').toLowerCase();
            var code = String(e.code || '');
            // Prevent Ctrl+S / Ctrl+س (Save webpage as HTML dialog)
            if (code === 'KeyS' || key === 's' || key === 'س') {
              e.preventDefault();
            }
            // Prevent Ctrl+P / Ctrl+ح (Browser default print dialog)
            if (code === 'KeyP' || key === 'p' || key === 'ح') {
              e.preventDefault();
            }
          }
        }, { capture: true, passive: false });
      })();
    </script>
